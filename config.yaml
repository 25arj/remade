# Tune this file without touching any code.

# Describe your service in your own words - this is given to Claude as context
# when it scores whether a Reddit post is a real lead.
service_description: >
  I sell workflow automation services to small and mid-sized businesses -
  things like automating repetitive manual tasks, connecting tools together
  (Zapier/Make/n8n style), scraping/data-entry automation, and building
  custom AI agents that handle busywork. I'm looking for people who are
  clearly spending too much time on manual, repetitive work and would pay
  someone to automate it for them.

# Subreddits to search (no "r/" prefix).
subreddits:
  - smallbusiness
  - Entrepreneur
  - automation
  - ecommerce
  - sysadmin
  - freelance
  - SaaS
  - nocode
  - selfhosted
  - virtualassistants
  - agency

# Search queries run against those subreddits (Reddit's own search API,
# fully within Reddit's terms of service - no scraping).
keywords:
  - "manually every day"
  - "spend hours doing"
  - "need to automate"
  - "is there a tool to automate"
  - "repetitive task"
  - "hire someone to automate"
  - "workflow automation"
  - "too much time doing this manually"
  - "any way to automate this"
  - "sick of doing this by hand"

# How many results to pull per keyword search (per subreddit group).
results_per_keyword: 15

# How far back to search.
time_filter: week   # one of: hour, day, week, month, year, all

# Claude gives each candidate post a 0-10 fit score. Only posts at or above
# this threshold get sent to Slack.
score_threshold: 7

# Safety cap on how many *new* posts get sent to Claude for scoring in one
# run, to bound API spend.
max_new_posts_per_run: 40

# Where processed post IDs are tracked so the same post is never re-scored
# or re-notified across runs.
state_file: state/seen_posts.json
